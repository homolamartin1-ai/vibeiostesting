name: BookNow
options:
  bundleIdPrefix: com.booknow
  deploymentTarget:
    iOS: "17.0"
targets:
  BookNow:
    type: application
    platform: iOS
    sources:
      - BookNow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.booknow.ios
        # Explicit Info.plist declares the UIScene manifest so the app launches on
        # iOS 26/27, which now enforce UIScene lifecycle adoption.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BookNow/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
