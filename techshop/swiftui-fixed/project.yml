# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   xcodegen generate
# then open TechShop.xcodeproj in Xcode and Run (⌘R) on an iPhone Simulator.
name: TechShop
options:
  bundleIdPrefix: com.techshop
  deploymentTarget:
    iOS: "17.0"
targets:
  TechShop:
    type: application
    platform: iOS
    sources:
      - TechShop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.techshop.ios
        # Explicit Info.plist declares the UIScene manifest so the app launches on
        # iOS 26/27, which now *enforce* UIScene lifecycle adoption (the old auto-
        # generated manifest trips a NoSceneLifecycleAdoption trap at launch).
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TechShop/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
